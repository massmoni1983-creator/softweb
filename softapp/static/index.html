<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siam Bistro</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <header>

        <div class="logo-section">
            <img src="logo.png" class="logo">
            <h1>SIGMA RESTAURENT</h1>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/menu/">Menu</a>
            <a href="/adminpage/">Administration</a>
            <a href="/contact/">Contact Us</a>
        </nav>

    </header>

    <section class="home-container">

        <div class="card">

            <img src="biryani.png">

            <h2>SPECIAL MENU</h2>

            <p>
                OUR SPECIAL CHICKEN VARIETY FOR 
                SMASHING YOUR HUNGER
            </p>

            <button>MENU</button>

        </div>

        <div class="card">

            <img src="BOOKING.png">

            <h2>TABLE BOOKING</h2>

            <p>
                BOOKING A TABLE WILL BE CONVINIENT 
                FOR YOUR DINING AND SAVING YOUR TIME
            </p>

            <button>TABLE BOOKING</button>

        </div>

        <div class="card">

            <img src="timig.png">

            <h2>Opening Hours</h2>

            <p>
                Mon - Fri : 9am - 11pm <br>
                Weekend : 7am - 12pm
            </p>

        </div>

    </section>

    <footer>

        <img src="logo.png" class="footer-logo">

        <p>SIGMA RESTAURENT</p>

    </footer>

</body>
</html>
